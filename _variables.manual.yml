version: 1                      # version of this parameter specification

########################################################################################
# Under this key we define the specificity and sensitivity for a range
# of diagnostic modalities. They are taken from literature.
modalities:
  CT: {spec: 0.76, sens: 0.81}
  MRI: {spec: 0.63, sens: 0.81}
  PET: {spec: 0.86, sens: 0.79}
  FNA: {spec: 0.98, sens: 0.80}
  diagnostic_consensus: {spec: 0.86, sens: 0.81}
  pathology: {spec: 1.0, sens: 1.0}
  pCT: {spec: 0.86, sens: 0.81}
  max_llh: {spec: 1.0, sens: 1.0}

########################################################################################
# Here, we define sampling parameters
sampling:
  walkers_per_dim: 12
  check_interval: 50
  trust_factor: 50.0
  relative_thresh: 0.05
  num_steps: 10
  thin_by: 10
  cores: 8

########################################################################################
# Below the dynamically computed values are inserted
